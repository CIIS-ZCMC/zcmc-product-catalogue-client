name: Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Server API Base URL'
        required: false
        default: 'https://product-registryapi.zcmc.online/api'

permissions:
  contents: read

jobs:
  build:
    name: 4. Build Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || 'https://product-registryapi.zcmc.online/api' }}
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-dist-${{ github.ref_name }}
          path: dist/
          retention-days: 14
